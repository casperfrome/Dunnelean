[package]
name = "dunnelean-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Embedded Python bindings for the Dunnelean synchronization engine"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
dunnelean = { path = "../..", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
