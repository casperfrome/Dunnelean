[package]
name = "dunnelean-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Stable C ABI for the embedded Dunnelean synchronization engine"
license = "Apache-2.0"
publish = false

[lib]
name = "dunnelean_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
dunnelean = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
